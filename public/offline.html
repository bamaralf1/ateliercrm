<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Offline — Atelier CRM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111827;
    color: #e5e5e5;
    font-family: -apple-system, 'Segoe UI', Roboto, 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    background: #1a1a2e;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 40px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .icone { font-size: 3rem; margin-bottom: 16px; }
  h1 { font-size: 1.4rem; margin-bottom: 10px; font-weight: 700; }
  p { font-size: 0.95rem; color: #9ca3af; margin-bottom: 24px; line-height: 1.5; }
  .btn {
    display: inline-block;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .btn:hover { background: #1d4ed8; }
</style>
</head>
<body>
  <div class="card">
    <div class="icone">📡</div>
    <h1>Você está offline</h1>
    <p>Sem conexão com a internet. Os dados que você já salvou estão seguros no seu dispositivo e ficarão disponíveis quando a conexão voltar.</p>
    <button class="btn" onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
