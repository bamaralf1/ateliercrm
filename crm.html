          <div><label style="font-size:0.8rem;color:var(--text-muted);">Qtd. mínima (alerta)</label><input type="number" id="fMatMin" value="${mat ? mat.quantidadeMinima || 0 : 0}" min="0" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;background:var(--bg);color:var(--text);box-sizing:border-box;"></div>
          <div><label style="font-size:0.8rem;color:var(--text-muted);">Preço unit. (R$)</label><input type="number" id="fMatPreco" value="${mat ? mat.precoUnitario || 0 : 0}" min="0" step="0.01" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;background:var(--bg);color:var(--text);box-sizing:border-box;"></div>
          <div><label style="font-size:0.8rem;color:var(--text-muted);">Local</label><input type="text" id="fMatLocal" value="${mat ? mat.local || '' : ''}" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;background:var(--bg);color:var(--text);box-sizing:border-box;"></div>
          <div><label style="font-size:0.8rem;color:var(--text-muted);">Data aquisição</label><input type="date" id="fMatData" value="${mat ? mat.dataAquisicao || '' : ''}" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;background:var(--bg);color:var(--text);box-sizing:border-box;"></div>
          <div class="campo-full"><label style="font-size:0.8rem;color:var(--text-muted);">Notas</label><textarea id="fMatNotas" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;background:var(--bg);color:var(--text);box-sizing:border-box;min-height:50px;">${mat ? mat.notas || '' : ''}</textarea></div>
        </div>
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="btnCancelarModal">Cancelar</button>
          <button type="submit" class="btn-primario">Salvar</button>
        </div>
      </form>
    `);

    document.getElementById('btnCancelarModal').addEventListener('click', fecharModal);
    document.getElementById('formModal').addEventListener('submit', (e) => {
      e.preventDefault();
      const dados = {
        nome: document.getElementById('fMatNome').value.trim(),
        categoria: document.getElementById('fMatCat').value,
        subcategoria: document.getElementById('fMatSub').value.trim(),
        marca: document.getElementById('fMatMarca').value.trim(),
        quantidade: Number(document.getElementById('fMatQtd').value) || 0,
        unidade: document.getElementById('fMatUn').value.trim() || 'un',
        quantidadeMinima: Number(document.getElementById('fMatMin').value) || 0,
        precoUnitario: Number(document.getElementById('fMatPreco').value) || 0,
        local: document.getElementById('fMatLocal').value.trim(),
        dataAquisicao: document.getElementById('fMatData').value,
        notas: document.getElementById('fMatNotas').value.trim()
      };
      if (!dados.nome) { mostrarToast('O nome é obrigatório.'); return; }
      if (isLista) dados.comprado = false;
      if (mat) {
        this.dataStore.atualizar('materiais', id, dados);
        mostrarToast('Material atualizado!');
      } else {
        this.dataStore.adicionar('materiais', dados);
        mostrarToast('Material adicionado!');
      }
      fecharModal();
      this.rerenderizar();
    });
  }

  excluirMaterial(id) {
    if (!confirm('Excluir este material?')) return;
    this.dataStore.remover('materiais', id);
    mostrarToast('Material excluído.');
    this.rerenderizar();
  }

  consumirRapido(id) {
    const mat = this.dataStore.buscarPorId('materiais', id);
    if (!mat) return;
    const obras = this.obras;
    const opcoes = obras.map(o => `<option value="${o.id}">${o.titulo || 'Sem título'}</option>`).join('');

    abrirModal(`
      <h3>📉 Consumir: ${mat.nome}</h3>
      <form id="formModal">
        <div class="campo-form"><label>Obra</label><select id="fConsObra">${opcoes}</select></div>
        <div class="campo-form"><label>Quantidade (${mat.unidade || 'un'} — atual: ${mat.quantidade})</label><input type="number" id="fConsQtd" value="1" min="0.1" step="0.1"></div>
        <div class="campo-form"><label>Data</label><input type="date" id="fConsData" value="${new Date().toISOString().slice(0, 10)}"></div>
        <div class="campo-form"><label>Notas</label><textarea id="fConsNotas" placeholder="Ex.: Camada de fundo"></textarea></div>
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="btnCancelarModal">Cancelar</button>
          <button type="submit" class="btn-primario">Consumir</button>
        </div>
      </form>
    `);

    document.getElementById('btnCancelarModal').addEventListener('click', fecharModal);
    document.getElementById('formModal').addEventListener('submit', (e) => {
      e.preventDefault();
      const qtd = Number(document.getElementById('fConsQtd').value) || 0;
      if (qtd <= 0) { mostrarToast('Quantidade inválida.'); return; }
      const novaQtd = Math.max(0, (Number(mat.quantidade) || 0) - qtd);
      this.dataStore.atualizar('materiais', id, { quantidade: novaQtd });
      this.dataStore.adicionar('consumos', {
        materialId: id,
        obraId: document.getElementById('fConsObra').value,
        quantidade: qtd,
        data: document.getElementById('fConsData').value,
        notas: document.getElementById('fConsNotas').value.trim()
      });
      fecharModal();
      mostrarToast(`${qtd} ${mat.unidade || 'un'} consumido(s) de "${mat.nome}". Novo estoque: ${novaQtd}.`);
      this.rerenderizar();
    });
  }

    const obrOpts = obras.map(o => `<option value="${o.id}">${o.titulo || 'Sem título'}</option>`).join('');

    abrirModal(`
      <h3>📋 Registrar Consumo</h3>
      <form id="formModal">
        <div class="campo-form"><label>Material</label><select id="fConsMat">${matOpts}</select></div>
        <div class="campo-form"><label>Obra</label><select id="fConsObraFull">${obrOpts}</select></div>
        <div class="campo-form"><label>Quantidade</label><input type="number" id="fConsQtdFull" value="1" min="0.1" step="0.1"></div>
        <div class="campo-form"><label>Data</label><input type="date" id="fConsDataFull" value="${new Date().toISOString().slice(0, 10)}"></div>
        <div class="campo-form"><label>Notas</label><textarea id="fConsNotasFull" placeholder="Ex.: Camada de fundo"></textarea></div>
        <div class="modal-acoes">
          <button type="button" class="btn-secundario" id="btnCancelarModal">Cancelar</button>
          <button type="submit" class="btn-primario">Registrar</button>
        </div>
      </form>
    `);

    document.getElementById('btnCancelarModal').addEventListener('click', fecharModal);
    document.getElementById('formModal').addEventListener('submit', (e) => {
      e.preventDefault();
      const matId = document.getElementById('fConsMat').value;
      const qtd = Number(document.getElementById('fConsQtdFull').value) || 0;
      if (qtd <= 0) { mostrarToast('Quantidade inválida.'); return; }

      }
      this.dataStore.adicionar('consumos', {
        materialId: matId,
        obraId: document.getElementById('fConsObraFull').value,
        quantidade: qtd,
        data: document.getElementById('fConsDataFull').value,
        notas: document.getElementById('fConsNotasFull').value.trim()
      });
      fecharModal();
      mostrarToast('Consumo registrado e estoque atualizado!');
      this.rerenderizar();
    });

    if (!confirm('Excluir este fornecedor?')) return;
    this.dataStore.remover('fornecedores', id);
    mostrarToast('Fornecedor excluído.');
    this.rerenderizar();
  }

  // --- Lista de Compras ---
  gerarListaCompras() {
    const materiais = this.materiais;
    let count = 0;
    materiais.forEach(m => {
      const q = Number(m.quantidade) || 0;
      const min = Number(m.quantidadeMinima) || 0;
      if (min > 0 && q <= min && m.comprado === undefined) {
        this.dataStore.atualizar('materiais', m.id, { comprado: false });
        count++;
      }
    });
    mostrarToast(`${count} item(ns) adicionado(s) à lista de compras!`);
    this.rerenderizar();
  }

  marcarComprado(id, comprado) {
    this.dataStore.atualizar('materiais', id, { comprado });
    mostrarToast(comprado ? 'Marcado como comprado!' : 'Reaberto na lista.');
    this.rerenderizar();
  }

  removerDaLista(id) {
    this.dataStore.atualizar('materiais', id, { comprado: undefined });
    mostrarToast('Item removido da lista.');
    this.rerenderizar();
  }

  exportarListaTXT() {
    const materiais = this.materiais.filter(m => m.comprado === false);
    if (materiais.length === 0) { mostrarToast('Lista vazia.'); return; }

    let txt = '=== LISTA DE COMPRAS — ATELIER ===\n';
    txt += `Gerada em: ${new Date().toLocaleDateString('pt-BR')}\n\n`;
    let total = 0;
    materiais.forEach(m => {
      const qtd = Math.max(1, Math.ceil(((Number(m.quantidadeMinima) || 0) * 2 - (Number(m.quantidade) || 0))));
      const preco = (Number(m.precoUnitario) || 0) * qtd;
      total += preco;
      txt += `□ ${m.nome}\n`;
      txt += `   Qtd: ${qtd} ${m.unidade || 'un'} | Cat: ${this.catLabels[m.categoria] || m.categoria}${m.marca ? ' | Marca: '+m.marca : ''}\n`;
      txt += `   Est.: ${formatarMoeda(Math.round(preco))}\n\n`;
    });
    txt += `=== CUSTO TOTAL ESTIMADO: ${formatarMoeda(Math.round(total))} ===\n`;

    const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `lista-compras-${new Date().toISOString().slice(0, 10)}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    mostrarToast('Lista exportada em TXT!');
  }

  // --- Utilitários ---
  rerenderizar() {
    const container = document.getElementById('viewPrincipal');
    if (container) {
      this.removerListeners();
      container.innerHTML = this.render();
      this.aposRenderizar();
    }
  }

  removerListeners() {
    Object.values(this._bindCache).forEach(({ el, handler, type }) => {
      try { el.removeEventListener(type, handler); } catch (e) {}
    });
    this._bindCache = {};
  }

  destruir() { this.removerListeners(); }
}

/* ==========================================================================
   5.1 MODAIS DE CADASTRO - Formulários dinâmicos por coleção
   Cada coleção tem uma definição de campos; o modal genérico é montado
   a partir dela e o salvamento delega ao DataStore.
   ========================================================================== */

// Definição dos campos de formulário para cada coleção do sistema
function definicaoFormulario(colecao, dataStore) {
  const definicoes = {
    // ===== REMOVIDO (MÓDULO CATÁLOGO): o cadastro de 'obras' agora é feito
    // exclusivamente pela classe CatalogoView (abrirFormulario), com suporte
    // a imagem, dimensões estruturadas e demais campos do novo módulo. =====
    // ===== REMOVIDO (MÓDULOS CLIENTES/VENDAS): 'clientes' agora é tratado
    // pela classe ClientesView (formulário com tags, endereço, notas e ficha
    // com timeline) e 'vendas' pela classe VendasView (seleção de obra/cliente,
    // cadastro rápido de cliente, condições de pagamento e pipeline de status). =====
    // ===== REMOVIDO (MÓDULOS CERTIFICADOS/REFERÊNCIAS): 'certificados' agora
    // é tratado pela CertificadosView (geração de PDF com jsPDF puro) e
    // 'referencias' pela ReferenciasView (board masonry com imagem/link/nota). =====
    encomendas: {
      titulo: 'Nova Encomenda',
      campos: [
        { id: 'clienteNome', label: 'Nome do cliente', tipo: 'text', obrigatorio: true },
        { id: 'descricao', label: 'Descrição do trabalho', tipo: 'textarea' },
        { id: 'prazo', label: 'Prazo de entrega', tipo: 'date' },
        { id: 'status', label: 'Status', tipo: 'select', opcoes: ['Em andamento', 'Aguardando aprovação', 'Concluída'] }
      ]
    },
    exposicoes: {
      titulo: 'Nova Exposição',
      campos: [
        { id: 'nome', label: 'Nome da exposição', tipo: 'text', obrigatorio: true },
        { id: 'local', label: 'Local', tipo: 'text' },
        { id: 'data', label: 'Data', tipo: 'date' }
      ]
    },
    transacoes: {
      titulo: 'Nova Transação',
      campos: [
        { id: 'descricao', label: 'Descrição', tipo: 'text', obrigatorio: true },
        { id: 'tipo', label: 'Tipo', tipo: 'select', opcoes: ['entrada', 'saida'], rotulos: { entrada: 'Entrada', saida: 'Saída' } },
        { id: 'valor', label: 'Valor (R$)', tipo: 'number', obrigatorio: true },
        { id: 'data', label: 'Data', tipo: 'date' }
      ]
    }
  };

  return definicoes[colecao];
}

// Monta o HTML de um campo de formulário conforme seu tipo
function montarCampoHtml(campo) {
  const idAttr = `id="campo_${campo.id}"`;
  const reqAttr = campo.obrigatorio ? 'required' : '';

  if (campo.tipo === 'select') {
    const opcoesHtml = campo.opcoes.map(op => {
      const rotulo = campo.rotulos ? campo.rotulos[op] : op;
      return `<option value="${op}">${rotulo}</option>`;
    }).join('');
    return `<select ${idAttr} ${reqAttr}>${opcoesHtml}</select>`;
  }
  if (campo.tipo === 'selectHtml') {
    return `<select ${idAttr} ${reqAttr}>${campo.html}</select>`;
  }
  if (campo.tipo === 'textarea') {
    return `<textarea ${idAttr} ${reqAttr} placeholder="${campo.placeholder || ''}"></textarea>`;
  }
  return `<input type="${campo.tipo}" ${idAttr} ${reqAttr} placeholder="${campo.placeholder || ''}">`;
}

// Abre o modal de cadastro para a coleção informada
function abrirModalNovoItem(colecao, dataStore, router) {
  const def = definicaoFormulario(colecao, dataStore);
  if (!def) return;

  const camposHtml = def.campos.map(campo => `
    <div class="campo-form">
      <label>${campo.label}</label>
      ${montarCampoHtml(campo)}
    </div>
  `).join('');

  abrirModal(`
    <h3>${def.titulo}</h3>
    <form id="formModal">
      ${camposHtml}
      <div class="modal-acoes">
        <button type="button" class="btn-secundario" id="btnCancelarModal">Cancelar</button>
        <button type="submit" class="btn-primario">Salvar</button>
      </div>
    </form>
  `);

  document.getElementById('btnCancelarModal').addEventListener('click', fecharModal);

  document.getElementById('formModal').addEventListener('submit', (e) => {
    e.preventDefault();
    const novoItem = {};
    def.campos.forEach(campo => {
      const el = document.getElementById(`campo_${campo.id}`);
      let valor = el.value;
      if (campo.tipo === 'number') valor = valor === '' ? 0 : Number(valor);
      novoItem[campo.id] = valor;
    });
    // Define emoji padrão para obras, conforme a técnica escolhida
    if (colecao === 'obras') {
      const mapaEmoji = { 'Óleo sobre tela': '🎨', 'Aquarela sobre papel': '💧', 'Escultura em bronze': '🗿', 'Escultura em madeira': '🪵', 'Escultura em argila': '🏺' };
      novoItem.emoji = mapaEmoji[novoItem.tecnica] || '🖼️';
      novoItem.status = novoItem.status || 'disponivel';
    }
    dataStore.adicionar(colecao, novoItem);
    fecharModal();
    mostrarToast('Registro salvo com sucesso!');
    router.navegar(router.viewAtual); // Re-renderiza a view atual com o novo dado
  });
}

// Delegação de eventos: escuta cliques na área de conteúdo para ações dinâmicas
// (evita reatribuir listeners a cada re-renderização de view)
document.getElementById('viewPrincipal').addEventListener('click', (e) => {
  // Qualquer botão "✚ Novo(a) ..." das telas de listagem (data-abrir-modal="colecao")
  const botaoModal = e.target.closest('[data-abrir-modal]');
  if (botaoModal) {
    abrirModalNovoItem(botaoModal.dataset.abrirModal, dataStore, router);
    return;
  }
  // Atalho "Nova Obra" no dashboard
  // ===== ALTERADO (MÓDULO CATÁLOGO): agora abre o formulário completo do catálogo =====
  if (e.target.id === 'btnAtalhoNovaObra') {
    catalogoView.abrirFormulario();
    return;
  }
  // ===== NOVO (MÓDULO GALERIA VIRTUAL): atalho "Ir para Catálogo" na tela vazia =====
  if (e.target.getAttribute('data-acao') === 'irCatalogo') {
    router.navegar('catalogo');
    return;
  }
  // Botão "Nova Venda" no dashboard
  // ===== ALTERADO (MÓDULOS CLIENTES/VENDAS): abre direto o formulário de venda,
  // sem precisar navegar até a tela de Vendas primeiro =====
  if (e.target.id === 'btnAtalhoVenda') {
    vendasView.abrirFormulario();
    return;
  }
  // Botão "Gerar Recibo" no dashboard
  // ===== ALTERADO (GERADOR DE PDF): abre a escolha rápida de venda e segue
  // direto para a assinatura + exportação do recibo =====
  if (e.target.id === 'btnAtalhoRecibo') {
    vendasView.abrirEscolhaRapida();
    return;
  }
  // Botão "Salvar Configurações"
  if (e.target.id === 'btnSalvarConfig') {
    const nome = document.getElementById('cfgNome').value.trim();
    const email = document.getElementById('cfgEmail').value.trim();
    const telefone = document.getElementById('cfgTelefone').value.trim();
    dataStore.dados.config.artista = { nome, email, telefone };
    // ===== NOVO (GERADOR DE PDF): persiste o texto de garantia customizado =====
    dataStore.dados.config.textoGarantia = document.getElementById('cfgTextoGarantia').value.trim();
    dataStore.salvar();
    mostrarToast('Configurações salvas com sucesso!');
  }
});
