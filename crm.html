/* ==========================================================================
    MÓDULO NOVO: GALERIA VIRTUAL 3D (/galeria-virtual)
   ========================================================================== */
class GaleriaVirtualView {
  constructor(dataStore, router) {
    this.dataStore = dataStore;
    this.router = router;
    this.anguloCamera = 0;
    this.posicaoZ = 0;
    this.ambienteAtual = 'branca';
    this.tourAtivo = false;
    this.tourInterval = null;
    this.tourIndex = 0;
    this.tourDuracao = 4;
    this.obrasVisiveis = [];
    this.zoomAtivo = null;
    this.zoomIndice = 0;
    this.teclasPressionadas = {};
    this.animFrame = null;
    this.suporta3d = true;
    this.paredesPorPagina = 4;
    this.paginaAtual = 0;
    this.totalPaginas = 1;
    this._keyHandler = null;
    this._touchStartX = 0;
    this._touchStartY = 0;
  }

  // --- Detecção de suporte a CSS 3D ---
  detectarSuporte3d() {
    try {
      const el = document.createElement('div');
      el.style.transformStyle = 'preserve-3d';
      this.suporta3d = el.style.transformStyle === 'preserve-3d';
    } catch (e) { this.suporta3d = false; }
  }

  // --- Carregar obras do DataStore ---
  carregarObras() {
    const todas = this.dataStore.listar('obras') || [];
    this.obrasVisiveis = todas.filter(o => o.imagem && (o.status === 'disponivel' || o.status === 'em exposicao' || o.status === 'disponível' || o.status === 'em exposição'));
    if (this.obrasVisiveis.length === 0) { this.obrasVisiveis = todas.filter(o => o.imagem).slice(0, 20); }
    if (this.obrasVisiveis.length > 20) this.obrasVisiveis = this.obrasVisiveis.slice(0, 20);
    this.paginaAtual = 0;
    this.totalPaginas = Math.max(1, Math.ceil(this.obrasVisiveis.length / this.paredesPorPagina));
  }

  // --- RENDER ---
  render() {
    this.carregarObras();
    this.detectarSuporte3d();
    const temObras = this.obrasVisiveis.length > 0;

    if (!temObras) {
      return `
        <div class="galeria-virtual" style="display:flex;align-items:center;justify-content:center;background:var(--bg);min-height:400px;">
          <div style="text-align:center;color:var(--text-muted);">
            <div style="font-size:3rem;margin-bottom:12px;">🏛️</div>
            <h3 style="margin:0 0 8px;color:var(--text);">Galeria Virtual</h3>
            <p style="margin:0;font-size:0.9rem;">Adicione obras com imagem no Catálogo para vê-las aqui.</p>
            <button class="btn-primario" style="margin-top:16px;" data-acao="irCatalogo">Ir para Catálogo</button>
          </div>
        </div>
      `;
    }

    const htmlParedes = this.gerarHtmlParedes();
    const ambLabel = { branca: 'Galeria Branca', classico: 'Atelier Clássico', moderno: 'Museu Moderno' };
    const ambIcone = { branca: '🏛️', classico: '🪵', moderno: '🌃' };

    return `
      <div class="galeria-virtual ${this.suporta3d ? 'com-3d' : 'sem-3d'} ambiente-${this.ambienteAtual}" id="galeriaContainer">
        <div class="barra-topo">
          <h2>🏛️ Galeria Virtual</h2>
          <div class="acoes-barra">
            <button class="btn-bar" id="btnCompartilhar" title="Compartilhar galeria">🔗 Compartilhar</button>
            <button class="btn-bar ${this.tourAtivo ? 'ativo' : ''}" id="btnTourToggle" title="Iniciar tour guiado">🎧 Tour</button>
            <select class="ambiente-select" id="selectAmbiente">
              <option value="branca" ${this.ambienteAtual === 'branca' ? 'selected' : ''}>🏛️ Galeria Branca</option>
              <option value="classico" ${this.ambienteAtual === 'classico' ? 'selected' : ''}>🪵 Atelier Clássico</option>
              <option value="moderno" ${this.ambienteAtual === 'moderno' ? 'selected' : ''}>🌃 Museu Moderno</option>
            </select>
          </div>
        </div>

        ${this.suporta3d ? `
        <div class="cena-3d-wrapper" id="cena3dWrapper">
          <div class="cena-3d" id="cena3d" style="transform: translateZ(${this.posicaoZ}px) rotateY(${this.anguloCamera}deg);">
            ${htmlParedes}
            <div class="chao"></div>
            <div class="iluminacao"></div>
          </div>
          <div class="hint-teclado" id="hintTeclado">WASD / setas para navegar<br>Clique na obra para detalhes</div>
          <div class="hud-navegacao" id="hudNavegacao">
            <button class="nav-btn" id="navEsquerda">◀</button>
            <span class="nav-indicador" id="navIndicador">${this.obrasVisiveis.length} obras</span>
            <button class="nav-btn" id="navDireita">▶</button>
            <button class="nav-btn" id="navCasa" title="Centralizar">⊙</button>
          </div>
          <div class="hud-tour ${this.tourAtivo ? 'visivel' : ''}" id="hudTour">
            <button class="tour-btn" id="tourPrev">◀</button>
            <button class="tour-btn ${this.tourAtivo ? 'ativo' : ''}" id="tourPlayPause">${this.tourAtivo ? '⏸' : '▶'}</button>
            <button class="tour-btn" id="tourNext">▶</button>
            <span class="tour-progresso" id="tourProgresso">1 / ${this.obrasVisiveis.length}</span>
            <div class="tour-duracao">
              <span>⏱</span>
              <input type="number" id="tourDuracao" value="${this.tourDuracao}" min="2" max="15" step="1">
              <span>seg</span>
            </div>
          </div>
        </div>
        ` : `
        <div class="galeria-2d-fallback">
          <p style="color:var(--text-muted);margin:0 0 16px;font-size:0.85rem;">Seu navegador não suporta visualização 3D completa. Exibindo grade 2D.</p>
          <div class="grid-2d">${this.obrasVisiveis.map((o, i) => `
            <div class="card-2d" data-obra-idx="${i}">
              <div class="card-2d-img" style="background-image:url('${o.imagem}')"></div>
              <div class="card-2d-info">
                <h4>${o.titulo || 'Sem título'}</h4>
                <p>${o.tecnica || ''} ${o.ano ? '· ' + o.ano : ''}</p>
                ${o.preco ? `<p style="font-weight:600;color:var(--accent)">${formatarMoeda(o.preco)}</p>` : ''}
              </div>
            </div>
          `).join('')}</div>
        </div>
        `}
      </div>

      <div class="overlay-obra-zoom" id="overlayObraZoom">
        <button class="zoom-fechar" id="zoomFechar">✕</button>
        <button class="zoom-navegar anterior" id="zoomAnterior">◀</button>
        <button class="zoom-navegar proximo" id="zoomProximo">▶</button>
        <div class="zoom-conteudo" id="zoomConteudo"></div>
      </div>
    `;
  }

  // --- Gerar HTML das paredes 3D ---
  gerarHtmlParedes() {
    if (this.obrasVisiveis.length === 0) return '';
    const obras = this.obrasVisiveis;
    const total = obras.length;
    const porParede = Math.ceil(total / this.paredesPorPagina);
    let html = '';
    // Transforms corretos para formar uma sala ao redor do visitante:
    // [frente, esquerda, direita, traseira]
    const walls = [
      { rot: 'rotateY(0deg)',   trans: 'translateZ(-700px)' },
      { rot: 'rotateY(-90deg)', trans: 'translateX(-700px)' },
      { rot: 'rotateY(90deg)',  trans: 'translateX(700px)'  },
      { rot: 'rotateY(180deg)', trans: 'translateZ(700px)'  }
    ];

    for (let p = 0; p < this.paredesPorPagina; p++) {
      const inicio = p * porParede;
      const fim = Math.min(inicio + porParede, total);
      const obrasParede = obras.slice(inicio, fim);
      if (obrasParede.length === 0) continue;

      const w = walls[p];
      html += `<div class="grupo-parede" style="transform: ${w.rot} ${w.trans};">`;
      html += `<div class="parede">`;
      html += `<div class="moldura-grid">`;
      obrasParede.forEach((obra, idx) => {
        const preco = obra.preco ? formatarMoeda(obra.preco) : '';
        const tecnica = obra.tecnica || '';
        const ano = obra.ano || '';
        html += `
          <div class="moldura" data-indice="${inicio + idx}" data-id="${obra.id}" title="${obra.titulo || ''}">
            <div class="moldura-moldura">
              <div class="obra-img" style="background-image:url('${obra.imagem}')"></div>
            </div>
            <div class="obra-legenda">
              <div class="obra-titulo">${obra.titulo || 'Sem título'}</div>
              ${tecnica ? `<div>${tecnica}${ano ? ' · '+ano : ''}</div>` : ''}
              ${preco ? `<div class="obra-preco">${preco}</div>` : ''}
            </div>
          </div>`;
      });
      html += `</div></div></div>`;
    }
    return html;
  }

  // --- EVENT BINDING ---
  aposRenderizar() {
    // Limpa estado anterior antes de religar eventos
    this.pararLoopAnimacao();
    this.removerTeclado();
    this.pararTour();
    this.fecharZoom();

    if (this.obrasVisiveis.length === 0) return;

    // Ambiente
    const selAmb = document.getElementById('selectAmbiente');
    if (selAmb) selAmb.addEventListener('change', () => this.mudarAmbiente(selAmb.value));

    // Navegação
    document.getElementById('navEsquerda')?.addEventListener('click', () => this.rotacionar(-45));
    document.getElementById('navDireita')?.addEventListener('click', () => this.rotacionar(45));
    document.getElementById('navCasa')?.addEventListener('click', () => this.centralizar());

    // Tour
    document.getElementById('btnTourToggle')?.addEventListener('click', () => this.toggleTour());
    document.getElementById('tourPlayPause')?.addEventListener('click', () => this.toggleTour());
    document.getElementById('tourPrev')?.addEventListener('click', () => this.tourAnterior());
    document.getElementById('tourNext')?.addEventListener('click', () => this.tourProximo());
    const inpDuracao = document.getElementById('tourDuracao');
    if (inpDuracao) inpDuracao.addEventListener('change', () => { this.tourDuracao = Math.max(2, Math.min(15, Number(inpDuracao.value) || 4)); });

    // Compartilhar
    document.getElementById('btnCompartilhar')?.addEventListener('click', () => this.compartilhar());

    // Clique nas obras (3D)
    const cena = document.getElementById('cena3d');
    if (cena) {
      cena.addEventListener('click', (e) => {
        const moldura = e.target.closest('.moldura');
        if (moldura) {
          const idx = parseInt(moldura.dataset.indice);
          this.abrirZoom(idx);
        }
      });
    }

    // Clique nas obras (2D)
    document.querySelectorAll('.card-2d[data-obra-idx]').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.obraIdx);
        this.abrirZoom(idx);
      });
    });

    // Zoom overlay
    document.getElementById('zoomFechar')?.addEventListener('click', () => this.fecharZoom());
    document.getElementById('zoomAnterior')?.addEventListener('click', () => this.navegarZoom(-1));
    document.getElementById('zoomProximo')?.addEventListener('click', () => this.navegarZoom(1));

    // Keyboard
    if (this.suporta3d) {
      this.removerTeclado();
      this._keyHandler = (e) => {
        const k = e.key;
        this.teclasPressionadas[k] = e.type === 'keydown';
        if (k === 'Escape') { this.fecharZoom(); this.pararTour(); }
        if (e.type === 'keydown' && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','A','d','D','w','W','s','S'].includes(k)) {
          e.preventDefault();
        }
      };
      window.addEventListener('keydown', this._keyHandler);
      window.addEventListener('keyup', this._keyHandler);

      // Touch
      const wrapper = document.getElementById('cena3dWrapper');
      if (wrapper) {
        wrapper.addEventListener('touchstart', (e) => {
          this._touchStartX = e.touches[0].clientX;
          this._touchStartY = e.touches[0].clientY;
        }, { passive: true });
        wrapper.addEventListener('touchmove', (e) => {
          if (this.zoomAtivo !== null) return;
          const dx = e.touches[0].clientX - this._touchStartX;
          const dy = e.touches[0].clientY - this._touchStartY;
          if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
            this.rotacionar(dx > 0 ? 15 : -15);
            this._touchStartX = e.touches[0].clientX;
          }
        }, { passive: true });
      }

      // Esconder hint após interação
      const hint = document.getElementById('hintTeclado');
      if (hint) {
        const hideHint = () => { hint.classList.add('escondido'); };
        window.addEventListener('keydown', hideHint, { once: true });
        wrapper?.addEventListener('click', hideHint, { once: true });
        wrapper?.addEventListener('touchstart', hideHint, { once: true });
      }

      // Animação loop para movimento suave
      this.iniciarLoopAnimacao();
    }

    // Overlay zoom click outside
    document.getElementById('overlayObraZoom')?.addEventListener('click', (e) => {
      if (e.target.id === 'overlayObraZoom') this.fecharZoom();
    });
  }

  // --- 3D Navigation ---
  rotacionar(angulo) {
    this.anguloCamera = (this.anguloCamera + angulo) % 360;
    this.atualizarCena();
    if (this.tourAtivo) this.atualizarProgressoTour();
  }

  moverFrente(dist) {
    this.posicaoZ = Math.max(-300, Math.min(100, this.posicaoZ + dist));
    this.atualizarCena();
  }

  centralizar() {
    this.anguloCamera = 0;
    this.posicaoZ = 0;
    this.atualizarCena();
  }

  atualizarCena() {
    const cena = document.getElementById('cena3d');
    if (cena) cena.style.transform = `translateZ(${this.posicaoZ}px) rotateY(${this.anguloCamera}deg)`;
  }

  // --- Animação loop ---
  iniciarLoopAnimacao() {
    this.pararLoopAnimacao();
    const loop = () => {
      if (this.teclasPressionadas['ArrowLeft'] || this.teclasPressionadas['a'] || this.teclasPressionadas['A']) this.rotacionar(-2);
      if (this.teclasPressionadas['ArrowRight'] || this.teclasPressionadas['d'] || this.teclasPressionadas['D']) this.rotacionar(2);
      if (this.teclasPressionadas['ArrowUp'] || this.teclasPressionadas['w'] || this.teclasPressionadas['W']) this.moverFrente(5);
      if (this.teclasPressionadas['ArrowDown'] || this.teclasPressionadas['s'] || this.teclasPressionadas['S']) this.moverFrente(-5);
      this.animFrame = requestAnimationFrame(loop);
    };
    this.animFrame = requestAnimationFrame(loop);
  }

  pararLoopAnimacao() {
    if (this.animFrame) { cancelAnimationFrame(this.animFrame); this.animFrame = null; }
  }

  removerTeclado() {
    if (this._keyHandler) {
      window.removeEventListener('keydown', this._keyHandler);
      window.removeEventListener('keyup', this._keyHandler);
      this._keyHandler = null;
    }
  }

  // --- Ambiente ---
  mudarAmbiente(amb) {
    this.ambienteAtual = amb;
    const container = document.getElementById('galeriaContainer');
    if (container) {
      ['ambiente-branca', 'ambiente-classico', 'ambiente-moderno'].forEach(c => container.classList.remove(c));
      container.classList.add(`ambiente-${amb}`);
    }
  }

  // --- Zoom ---
  abrirZoom(idx) {
    if (idx < 0 || idx >= this.obrasVisiveis.length) return;
    this.zoomAtivo = idx;
    this.zoomIndice = idx;
    const obra = this.obrasVisiveis[idx];
    const overlay = document.getElementById('overlayObraZoom');
    const conteudo = document.getElementById('zoomConteudo');
    if (!overlay || !conteudo) return;

    const preco = obra.preco ? formatarMoeda(obra.preco) : '';
    const tec = obra.tecnica || '';
    const dim = obra.dimensoes ? `${obra.dimensoes.altura || '?'} × ${obra.dimensoes.largura || '?'}${obra.dimensoes.profundidade ? ' × ' + obra.dimensoes.profundidade : ''} cm` : '';
    const status = obra.status || '';
    const statusLabel = { 'disponivel': 'Disponível', 'vendida': 'Vendida', 'reservada': 'Reservada', 'em exposicao': 'Em Exposição', 'disponível': 'Disponível', 'em exposição': 'Em Exposição' };

    conteudo.innerHTML = `
      <img class="zoom-img" src="${obra.imagem}" alt="${obra.titulo || ''}" onerror="this.outerHTML='<div style=\\'color:rgba(255,255,255,0.5);padding:40px;font-size:1.5rem;\\'>🖼️</div>'">
      <div class="zoom-info">
        <h3>${obra.titulo || 'Sem título'}</h3>
        ${obra.serie ? `<p style="font-style:italic;color:rgba(255,255,255,0.5);font-size:0.8rem;">Série: ${obra.serie}</p>` : ''}
        <p>${tec ? tec + (obra.ano ? ' · ' + obra.ano : '') : (obra.ano ? obra.ano : '')}</p>
        ${dim ? `<p>${dim}</p>` : ''}
        ${obra.descricao ? `<p style="font-size:0.8rem;color:rgba(255,255,255,0.6);max-width:400px;margin:6px auto;">${obra.descricao}</p>` : ''}
        ${preco ? `<div class="preco-zoom">${preco}</div>` : ''}
        <p style="font-size:0.8rem;color:rgba(255,255,255,0.5);margin-top:8px;">${statusLabel[status] || status || ''}</p>
      </div>
    `;
    overlay.classList.add('ativo');
    document.body.style.overflow = 'hidden';
  }

  fecharZoom() {
    const overlay = document.getElementById('overlayObraZoom');
    if (overlay) overlay.classList.remove('ativo');
    this.zoomAtivo = null;
    document.body.style.overflow = '';
  }

  navegarZoom(dir) {
    const novo = (this.zoomIndice + dir + this.obrasVisiveis.length) % this.obrasVisiveis.length;
    this.abrirZoom(novo);
  }

  // --- Tour ---
  toggleTour() {
    if (this.tourAtivo) this.pararTour();
    else this.iniciarTour();
  }

  iniciarTour() {
    if (this.obrasVisiveis.length === 0) return;
    this.tourAtivo = true;
    this.tourIndex = 0;
    this.mostrarHudTour(true);
    this.atualizarBotaoTour();
    this.focarObraTour(0);
    this.iniciarTimerTour();
  }

  pararTour() {
    this.tourAtivo = false;
    this.pararTimerTour();
    this.mostrarHudTour(false);
    this.atualizarBotaoTour();
  }

  iniciarTimerTour() {
    this.pararTimerTour();
    this.tourInterval = setInterval(() => {
      if (!this.tourAtivo) return;
      this.tourProximo();
    }, this.tourDuracao * 1000);
  }

  pararTimerTour() {
    if (this.tourInterval) { clearInterval(this.tourInterval); this.tourInterval = null; }
  }

  tourAnterior() {
    if (this.obrasVisiveis.length === 0) return;
    this.tourIndex = (this.tourIndex - 1 + this.obrasVisiveis.length) % this.obrasVisiveis.length;
    this.focarObraTour(this.tourIndex);
    if (this.tourAtivo) this.reiniciarTimerTour();
  }

  tourProximo() {
    if (this.obrasVisiveis.length === 0) return;
    this.tourIndex = (this.tourIndex + 1) % this.obrasVisiveis.length;
    if (this.tourIndex === 0 && this.tourAtivo) { this.pararTour(); return; }
    this.focarObraTour(this.tourIndex);
    if (this.tourAtivo) this.reiniciarTimerTour();
  }

  reiniciarTimerTour() {
    if (this.tourAtivo) {
      this.pararTimerTour();
      this.iniciarTimerTour();
    }
  }

  focarObraTour(idx) {
    if (idx < 0 || idx >= this.obrasVisiveis.length) return;
    this.tourIndex = idx;
    const total = this.obrasVisiveis.length;
    const porParede = Math.ceil(total / this.paredesPorPagina);
    const paredeIdx = Math.floor(idx / porParede);
    const angulos = [0, -90, 90, 180];
    this.anguloCamera = angulos[paredeIdx] || 0;
    this.posicaoZ = -30;
    this.atualizarCena();

    const prog = document.getElementById('tourProgresso');
    if (prog) prog.textContent = `${idx + 1} / ${total}`;

    // Destaque a moldura
    document.querySelectorAll('.moldura').forEach(el => {
      el.style.outline = 'none';
      el.style.transform = '';
    });
    setTimeout(() => {
      const moldura = document.querySelector(`.moldura[data-indice="${idx}"]`);
      if (moldura) {
        moldura.style.outline = '3px solid var(--accent, #fff)';
        moldura.style.outlineOffset = '4px';
        moldura.style.transform = 'translateZ(20px) scale(1.05)';
      }
    }, 100);
  }

  atualizarProgressoTour() {
    const total = this.obrasVisiveis.length;
    const porParede = Math.ceil(total / this.paredesPorPagina);
    const paredeIdx = Math.floor((this.tourIndex || 0) / porParede);
    const angulos = [0, -90, 90, 180];
    const angAlvo = angulos[paredeIdx] || 0;
    if (Math.abs(this.anguloCamera - angAlvo) > 30) {
      const prog = document.getElementById('tourProgresso');
      if (prog) prog.textContent = `—`;
    }
  }

  mostrarHudTour(visivel) {
    const hud = document.getElementById('hudTour');
    if (hud) hud.classList.toggle('visivel', visivel);
  }

  atualizarBotaoTour() {
    const btn = document.getElementById('btnTourToggle');
    if (btn) { btn.classList.toggle('ativo', this.tourAtivo); btn.textContent = this.tourAtivo ? '⏹ Tour' : '🎧 Tour'; }
    const pp = document.getElementById('tourPlayPause');
    if (pp) { pp.classList.toggle('ativo', this.tourAtivo); pp.textContent = this.tourAtivo ? '⏸' : '▶'; }
  }

  // --- Compartilhar ---
  compartilhar() {
    const hash = `#galeria=virtual&tour=obras-disponiveis`;
    const url = window.location.origin + window.location.pathname + hash;
    const msg = `Olá! 🎨 Convido você para um tour virtual pela minha galeria de obras:\n${url}\n\nAprecie a exposição!`;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(msg).then(() => this.mostrarToastCompartilhar(url)).catch(() => this.fallbackCompartilhar(url, msg));
    } else {
      this.fallbackCompartilhar(url, msg);
    }
  }

  fallbackCompartilhar(url, msg) {
    const ta = document.createElement('textarea');
    ta.value = msg;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); this.mostrarToastCompartilhar(url); } catch (e) { prompt('Copie o link abaixo:', url); }
    document.body.removeChild(ta);
  }

  mostrarToastCompartilhar(url) {
    const existente = document.querySelector('.toast-compartilhar');
    if (existente) existente.remove();

    const toast = document.createElement('div');
    toast.className = 'toast-compartilhar';
    toast.innerHTML = `
      <span>✅ Link copiado!</span>
      <span style="font-size:0.75rem;color:rgba(255,255,255,0.5);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${url}</span>
      <button class="btn-toast" id="btnAbrirLinkCompartilhado">Abrir</button>
    `;
    document.body.appendChild(toast);
    document.getElementById('btnAbrirLinkCompartilhado')?.addEventListener('click', () => {
      toast.remove();
      if (this.router) this.router.navegar('galeriaVirtual');
    });
    setTimeout(() => { if (toast.parentNode) toast.remove(); }, 5000);
  }

  // --- Destroy / Cleanup ---
  destruir() {
    this.pararTour();
    this.pararLoopAnimacao();
    this.removerTeclado();
    this.fecharZoom();
  }
}
/* ===== FIM MÓDULO NOVO: GALERIA VIRTUAL 3D ===== */

/* ==========================================================================
    MÓDULO NOVO: PRECIFICADOR INTELIGENTE (/precificador)
   ========================================================================== */
class PrecificadorView {
  constructor(dataStore, router) {
    this.dataStore = dataStore;
    this.router = router;
    this.calc = { materiais: 0, horas: 0, valorHora: 60, largura: 0, altura: 0, complexidade: 3, obraId: '' };
    this.fatoresComplexidade = [0, 0.7, 0.85, 1.0, 1.2, 1.5];
    this._bindCache = {};
  }

  get config() { return this.dataStore.dados.config.precificador || {}; }

  salvarConfig(cfg) {
    const c = this.dataStore.dados.config;
    c.precificador = { ...(c.precificador || {}), ...cfg };
    this.dataStore.salvar();
  }

  // --- RENDER ---
  render() {
    const cfg = this.config;
    const obras = this.dataStore.listar('obras') || [];
    const vendas = this.dataStore.listar('vendas') || [];
    const temObras = obras.length > 0;

    this.calc.valorHora = cfg.valorHora || 60;

    const opcoesObra = obras.map(o => `<option value="${o.id}">${o.titulo || 'Sem título'}${o.preco ? ' — ' + formatarMoeda(o.preco) : ''}</option>`).join('');

    const cardsAnalise = temObras ? this.renderAnalise(obras, vendas) : '<p style="color:var(--text-muted);font-size:0.85rem;">Adicione obras no Catálogo para ver análises.</p>';
    const metasHtml = this.renderMetas(obras, vendas);
    const historicoHtml = temObras ? this.renderHistoricoPrecos(obras) : '';

    const precoSugerido = this.calcularPreco(this.calc);

    return `
      <div class="precificador" id="precificadorContainer">
        <div class="card">
          <h3>🧮 Calculadora de Preço</h3>
          <div class="calc-grid">
            <div class="campo-calc" style="grid-column:1/-1">
              <label>Obra de referência (opcional)</label>
              <select class="sel-obra-calc" id="selObraCalc"><option value="">— Selecionar obra existente —</option>${opcoesObra}</select>
            </div>
            <div class="campo-calc">
              <label>💰 Custo materiais (R$)</label>
              <input type="number" id="calcMateriais" value="${this.calc.materiais || 0}" min="0" step="0.1">
            </div>
            <div class="campo-calc">
              <label>⏱ Horas trabalhadas</label>
              <input type="number" id="calcHoras" value="${this.calc.horas || 0}" min="0" step="0.5">
            </div>
            <div class="campo-calc">
              <label>💵 Valor hora (R$)</label>
              <input type="number" id="calcValorHora" value="${this.calc.valorHora}" min="0" step="1">
            </div>
            <div class="campo-calc">
              <label>📐 Dimensões (cm)</label>
              <div style="display:flex;gap:6px;">
                <input type="number" id="calcLargura" value="${this.calc.largura || 0}" min="0" placeholder="Larg." style="flex:1">
                <span style="align-self:center;color:var(--text-muted);font-size:0.8rem;">×</span>
                <input type="number" id="calcAltura" value="${this.calc.altura || 0}" min="0" placeholder="Alt." style="flex:1">
              </div>
            </div>
            <div class="campo-calc">
              <label>⭐ Complexidade</label>
              <div class="estrelas-input" id="estrelasInput">
                ${[1,2,3,4,5].map(i => `<span class="estrela ${i <= this.calc.complexidade ? 'preenchida' : ''}" data-val="${i}">★</span>`).join('')}
              </div>
            </div>
          </div>

          <div class="resultado-preco" id="resultadoPreco">
            <div class="rotulo-sugerido">Preço Sugerido</div>
            <div class="valor-sugerido" id="valorSugerido">${formatarMoeda(precoSugerido)}</div>
            <div class="detalhe-calculo" id="detalheCalculo">${this.detalharCalculo(precoSugerido)}</div>
          </div>

          <div id="faixaComparativa">${this.renderFaixaComparativa(obras)}</div>

          <button class="btn-primario" id="btnSalvarPrecoCalc" style="margin-top:12px;width:100%;">💾 Salvar preço sugerido na obra</button>
        </div>

        <div class="card">
          <h3>📋 Histórico de Preços</h3>
          ${historicoHtml || '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:0.85rem;">Nenhuma obra com histórico de preços.</div>'}
        </div>

        <div class="card card-full">
          <h3>📊 Análise do Portfólio</h3>
          ${cardsAnalise}
        </div>

        <div class="card card-full">
          <h3>🎯 Metas Financeiras</h3>
          ${metasHtml}
        </div>

        <div class="card card-full" id="secaoRelatorio">
          <h3>📄 Relatório de Precificação</h3>
          <p style="font-size:0.85rem;color:var(--text-muted);margin:0 0 12px;">Exporte um relatório completo com todos os preços sugeridos, análise de portfólio e metas.</p>
          <button class="btn-primario" id="btnExportarRelatorio">📄 Exportar Relatório em PDF</button>
        </div>
      </div>
    `;
  }

  // --- Cálculo ---
  calcularPreco(c) {
    const materiais = Number(c.materiais) || 0;
    const horas = Number(c.horas) || 0;
    const valorHora = Number(c.valorHora) || 60;
    const complexidade = Math.max(1, Math.min(5, Number(c.complexidade) || 3));
    const mult = this.config.multiplicadorExperiencia || 1.5;
    const fator = this.fatoresComplexidade[complexidade] || 1.0;
    const base = materiais + (horas * valorHora);
    const area = (Number(c.largura) || 0) * (Number(c.altura) || 0);
    const bonusArea = area > 0 ? 1 + (area / 10000) : 1;
    return Math.round(base * mult * fator * bonusArea);
  }

  detalharCalculo(preco) {
    const c = this.calc;
    const m = Number(c.materiais) || 0;
    const h = Number(c.horas) || 0;
    const vh = Number(c.valorHora) || 60;
    const mult = this.config.multiplicadorExperiencia || 1.5;
    const fator = this.fatoresComplexidade[Math.max(1, Math.min(5, Number(c.complexidade) || 3))];
    const area = (Number(c.largura) || 0) * (Number(c.altura) || 0);
    const bonus = area > 0 ? 1 + (area / 10000) : 1;
    return `R$ ${m.toFixed(0)} + (${h}h × R$ ${vh}) × ${mult} × ${fator}${bonus !== 1 ? ` × ${bonus.toFixed(2)} (área)` : ''} = R$ ${preco}`;
  }

  renderFaixaComparativa(obras) {
    const c = this.calc;
    const area = (Number(c.largura) || 0) * (Number(c.altura) || 0);
    if (!area || obras.length < 2) return '';
    const similares = obras.filter(o => {
      const dim = o.dimensoes;
      if (!dim || !dim.largura || !dim.altura) return false;
      const oArea = dim.largura * dim.altura;
      return oArea > area * 0.5 && oArea < area * 1.5 && o.preco > 0;
    });
    if (similares.length < 2) return '';
    const precos = similares.map(o => Number(o.preco)).sort((a, b) => a - b);
    const min = precos[0], max = precos[precos.length - 1];
    const media = Math.round(precos.reduce((s, v) => s + v, 0) / precos.length);
    return `
      <div class="faixa-comparativo">
        <div class="faixa-item"><div class="faixa-valor">${formatarMoeda(min)}</div><div class="faixa-rotulo">Menor similar</div></div>
        <div class="faixa-item"><div class="faixa-valor">${formatarMoeda(media)}</div><div class="faixa-rotulo">Média similares</div></div>
        <div class="faixa-item"><div class="faixa-valor">${formatarMoeda(max)}</div><div class="faixa-rotulo">Maior similar</div></div>
      </div>
    `;
  }

  // --- Histórico de Preços ---
  renderHistoricoPrecos(obras) {
    const comHistorico = obras.filter(o => o.historicoPrecos && o.historicoPrecos.length > 0);
    if (comHistorico.length === 0) return '';

    const obra = comHistorico[0];
    const hist = obra.historicoPrecos;
    const precos = hist.map(h => Number(h.preco)).concat([Number(obra.preco) || 0]).filter(p => p > 0);
    if (precos.length < 2) return '';

    const maxP = Math.max(...precos) * 1.15;
    const minP = Math.min(...precos) * 0.85;
    const range = maxP - minP || 1;
    const w = 400, h = 140;
    const padX = 40, padY = 20;
    const cw = w - padX * 2, ch = h - padY * 2;

    const pts = precos.map((p, i) => ({
      x: padX + (i / (precos.length - 1 || 1)) * cw,
      y: padY + ch - ((p - minP) / range) * ch,
      valor: p, label: i < hist.length ? hist[i].data?.slice(0, 7) || '' : 'Atual'
    }));

    const lineD = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const areaD = `M${pts[0].x},${padY + ch} ${lineD.slice(1)} L${pts[pts.length - 1].x},${padY + ch} Z`;

    const vendas = this.dataStore.listar('vendas') || [];
    const vendaObra = vendas.filter(v => String(v.obraId) === obra.id || v.obraTitulo === obra.titulo);

    return `
      <div style="margin-bottom:12px;">
        <select id="selHistoricoObra" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;background:var(--bg);color:var(--text);">
          ${comHistorico.map(o => `<option value="${o.id}">${o.titulo || 'Sem título'}</option>`).join('')}
        </select>
        <span style="font-size:0.75rem;color:var(--text-muted);margin-left:8px;">${obra.titulo} — ${hist.length} reajustes</span>
      </div>
      <svg viewBox="0 0 ${w} ${h}" class="svg-chart" style="height:${h}px;">
        <defs><linearGradient id="gradArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
        ${[0.25,0.5,0.75].map(f => `<line class="chart-grid" x1="${padX}" y1="${padY + ch - ch * f}" x2="${padX + cw}" y2="${padY + ch - ch * f}"/>`).join('')}
        ${[0,0.25,0.5,0.75,1].map(f => `<text class="chart-label" x="${padX - 8}" y="${padY + ch - ch * f + 3}" text-anchor="end">${formatarMoeda(minP + range * f)}</text>`).join('')}
        <path class="chart-area" d="${areaD}"/>
        <path class="chart-line" d="${lineD}"/>
        ${pts.map((p, i) => `<circle class="chart-dot ${i < hist.length && vendaObra.some(v => v.dataVenda && new Date(v.dataVenda) >= new Date(hist[i].data || 0) - 86400000 && new Date(v.dataVenda) <= new Date(hist[i].data || Date.now()) + 86400000) ? 'vendido' : ''}" cx="${p.x}" cy="${p.y}"/>`).join('')}
        ${pts.map(p => `<text class="chart-valor" x="${p.x}" y="${p.y - 8}">${formatarMoeda(p.valor)}</text>`).join('')}
        ${pts.map(p => `<text class="chart-label" x="${p.x}" y="${padY + ch + 14}">${p.label}</text>`).join('')}
      </svg>
      <div style="font-size:0.7rem;color:var(--text-muted);margin-top:4px;display:flex;gap:12px;justify-content:center;">
        <span>● <span style="color:var(--accent)">Evolução</span></span>
        <span>● <span style="color:#10b981">Vendido</span></span>
      </div>
    `;
  }

  // --- Análise ---
  renderAnalise(obras, vendas) {
    const precos = obras.filter(o => Number(o.preco) > 0).map(o => Number(o.preco));
    const precoMedio = precos.length ? Math.round(precos.reduce((s, v) => s + v, 0) / precos.length) : 0;
    const maiorPreco = precos.length ? Math.max(...precos) : 0;
    const menorPreco = precos.length ? Math.min(...precos) : 0;
    const valorTotal = precos.reduce((s, v) => s + v, 0);

    const tecnicas = {};
    obras.forEach(o => {
      if (!o.preco) return;
      const tec = o.tecnica || 'Outra';
      if (!tecnicas[tec]) tecnicas[tec] = { soma: 0, count: 0 };
      tecnicas[tec].soma += Number(o.preco);
      tecnicas[tec].count++;
    });

    // Média por técnica
    const tecRows = Object.entries(tecnicas).map(([tec, d]) => ({
      tec, media: Math.round(d.soma / d.count), count: d.count
    })).sort((a, b) => b.media - a.media);

    // Histograma
    const numBarras = 8;
    const maxPreco = Math.max(...precos, 1);
    const bucketSize = maxPreco / numBarras || 1;
    const buckets = Array(numBarras).fill(0);
    const bucketLabels = [];
    for (let i = 0; i < numBarras; i++) {
      bucketLabels.push(`${formatarMoeda(i * bucketSize)}-${formatarMoeda((i + 1) * bucketSize)}`);
    }
    precos.forEach(p => {
      const idx = Math.min(Math.floor(p / bucketSize), numBarras - 1);
      buckets[idx]++;
    });
    const maxCount = Math.max(...buckets, 1);
    const histBars = buckets.map((c, i) => `<div class="barra" style="height:${(c / maxCount) * 100}%"><span class="barra-count">${c}</span><span class="barra-label">${bucketLabels[i]}</span></div>`).join('');

    // Subprecificadas
    const subprecificadas = obras.filter(o => {
      if (!o.preco || !o.dimensoes || !o.dimensoes.largura || !o.dimensoes.altura) return false;
      const area = o.dimensoes.largura * o.dimensoes.altura;
      const similares = obras.filter(s => {
        if (s.id === o.id || !s.preco) return false;
        const sd = s.dimensoes;
        if (!sd || !sd.largura || !sd.altura) return false;
        const sa = sd.largura * sd.altura;
        return sa > area * 0.5 && sa < area * 1.5;
      });
      if (similares.length < 2) return false;
      const mediaSimilar = similares.reduce((s, v) => s + Number(v.preco), 0) / similares.length;
      return Number(o.preco) < mediaSimilar * 0.7;
    });

    // Tempo médio de venda
    const vendasComObra = vendas.filter(v => v.dataVenda && v.obraId);
    const temposVenda = vendasComObra.map(v => {
      const obra = obras.find(o => o.id === v.obraId);
      if (!obra || !obra.criadoEm) return null;
      const criacao = new Date(obra.criadoEm).getTime();
      const venda = new Date(v.dataVenda).getTime();
      return venda > criacao ? Math.round((venda - criacao) / 86400000) : null;
    }).filter(t => t !== null);
    const tempoMedio = temposVenda.length ? Math.round(temposVenda.reduce((s, t) => s + t, 0) / temposVenda.length) : null;

    return `
      <div class="analise-grid" style="margin-bottom:16px;">
        <div class="analise-card"><div class="analise-valor">${formatarMoeda(precoMedio)}</div><div class="analise-rotulo">💰 Preço médio</div></div>
        <div class="analise-card"><div class="analise-valor">${formatarMoeda(valorTotal)}</div><div class="analise-rotulo">📦 Valor total do portfólio</div></div>
        <div class="analise-card"><div class="analise-valor">${precos.length}</div><div class="analise-rotulo">🖼️ Obras precificadas</div></div>
        <div class="analise-card"><div class="analise-valor">${formatarMoeda(menorPreco)} — ${formatarMoeda(maiorPreco)}</div><div class="analise-rotulo">📊 Faixa de preços</div></div>
        <div class="analise-card"><div class="analise-valor">${tempoMedio !== null ? tempoMedio + ' dias' : '—'}</div><div class="analise-rotulo">⏱ Tempo médio p/ vender</div></div>
        <div class="analise-card"><div class="analise-valor">${subprecificadas.length}</div><div class="analise-rotulo">⚠️ Possivelmente subprecificadas</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div>
          <h4 style="margin:0 0 8px;font-size:0.85rem;color:var(--text-muted);">Distribuição de Preços</h4>
          <div class="histograma">${histBars}</div>
        </div>
        <div>
          <h4 style="margin:0 0 8px;font-size:0.85rem;color:var(--text-muted);">Média de Preço por Técnica</h4>
          <table class="tabela-media">
            <tr><th>Técnica</th><th>Média</th><th>Obras</th></tr>
            ${tecRows.map(r => `<tr><td>${r.tec}</td><td>${formatarMoeda(r.media)}</td><td>${r.count}</td></tr>`).join('')}
          </table>
        </div>
      </div>
      ${subprecificadas.length > 0 ? `
      <div style="margin-top:16px;">
        <h4 style="margin:0 0 8px;font-size:0.85rem;color:#92400e;">⚠️ Obras que podem estar subprecificadas</h4>
        <ul class="sub-list">
          ${subprecificadas.map(o => {
            const area = o.dimensoes.largura * o.dimensoes.altura;
            const similares = obras.filter(s => {
              if (s.id === o.id || !s.preco) return false;
              const sd = s.dimensoes;
              if (!sd || !sd.largura || !sd.altura) return false;
              const sa = sd.largura * sd.altura;
              return sa > area * 0.5 && sa < area * 1.5;
            });
            const mediaSimilar = similares.reduce((s, v) => s + Number(v.preco), 0) / similares.length;
            const diff = Math.round(mediaSimilar - Number(o.preco));
            return `<li class="sub-alert"><span class="sub-nome">${o.titulo || 'Sem título'}</span><span class="sub-valores">Atual: ${formatarMoeda(o.preco)} | Sugerido: ${formatarMoeda(mediaSimilar)}</span><span class="sub-diff">+${formatarMoeda(diff)}</span></li>`;
          }).join('')}
        </ul>
      </div>` : ''}
    `;
  }

  // --- Metas ---
  renderMetas(obras, vendas) {
    const cfg = this.config;
    const metaMensal = Number(cfg.metaMensal) || 10000;
    const metaAnual = Number(cfg.metaAnual) || 120000;

    // Faturamento do mês atual
    const agora = new Date();
    const mesAtual = agora.getMonth();
    const anoAtual = agora.getFullYear();
    const faturamentoMes = vendas.filter(v => {
      if (!v.dataVenda || !v.valorTotal) return false;
      const d = new Date(v.dataVenda);
      return d.getMonth() === mesAtual && d.getFullYear() === anoAtual;
    }).reduce((s, v) => s + Number(v.valorTotal), 0);

    // Faturamento do ano
    const faturamentoAno = vendas.filter(v => {
      if (!v.dataVenda || !v.valorTotal) return false;
      const d = new Date(v.dataVenda);
      return d.getFullYear() === anoAtual;
    }).reduce((s, v) => s + Number(v.valorTotal), 0);

    const pctMes = Math.min(100, metaMensal > 0 ? Math.round((faturamentoMes / metaMensal) * 100) : 0);
    const pctAno = Math.min(100, metaAnual > 0 ? Math.round((faturamentoAno / metaAnual) * 100) : 0);

    // Projeção
    const diaAtual = agora.getDate();
    const diasNoMes = new Date(anoAtual, mesAtual + 1, 0).getDate();
    const diasRestantes = diasNoMes - diaAtual;
    const ritmoDiario = diaAtual > 0 ? faturamentoMes / diaAtual : 0;
    const diasParaMeta = ritmoDiario > 0 ? Math.ceil((metaMensal - faturamentoMes) / ritmoDiario) : null;
    const projecao = ritmoDiario > 0 ? `Com o ritmo atual (${formatarMoeda(Math.round(ritmoDiario))}/dia), você ${diasParaMeta !== null && diasParaMeta <= diasRestantes ? `atingirá a meta mensal em <strong>${diasParaMeta} dias</strong>.` : `<strong>não</strong> atingirá a meta mensal a tempo.`}` : '';

    // Sugestão
    const falta = Math.max(0, metaMensal - faturamentoMes);
    const precoMedio = obras.filter(o => Number(o.preco) > 0).reduce((s, o) => s + Number(o.preco), 0) / Math.max(1, obras.filter(o => Number(o.preco) > 0).length);
    const obrasNecessarias = precoMedio > 0 ? Math.ceil(falta / precoMedio) : 0;
    const sugestao = falta > 0 && precoMedio > 0 ? `Você precisa vender <strong>${obrasNecessarias} obra${obrasNecessarias > 1 ? 's' : ''}</strong> de ~${formatarMoeda(Math.round(precoMedio))} para atingir a meta mensal.` : 'Meta mensal já atingida! 🎉';

    const circM = this.circuloProgresso(pctMes, `${pctMes}%`, 'do mês');
    const circA = this.circuloProgresso(pctAno, `${pctAno}%`, 'do ano');

    return `
      <div class="metas-grid">
        <div class="card meta-card">
          <div class="meta-rotulo">Meta Mensal</div>
          <div class="meta-valor">${formatarMoeda(metaMensal)}</div>
          <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0;">
            <span style="font-size:0.85rem;color:var(--text-muted);">Faturamento: ${formatarMoeda(faturamentoMes)}</span>
          </div>
          ${circM}
          <div class="meta-edit">
            <input type="number" id="metaMensalInput" value="${metaMensal}" min="0" step="100">
            <button class="btn-secundario" id="btnSalvarMetaMensal">Salvar</button>
          </div>
          ${projecao ? `<div class="meta-projecao">📈 ${projecao}</div>` : ''}
          ${sugestao ? `<div class="meta-sugestao">💡 ${sugestao}</div>` : ''}
        </div>
        <div class="card meta-card">
          <div class="meta-rotulo">Meta Anual</div>
          <div class="meta-valor">${formatarMoeda(metaAnual)}</div>
          <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0;">
            <span style="font-size:0.85rem;color:var(--text-muted);">Faturamento: ${formatarMoeda(faturamentoAno)}</span>
          </div>
          ${circA}
          <div class="meta-edit">
            <input type="number" id="metaAnualInput" value="${metaAnual}" min="0" step="1000">
            <button class="btn-secundario" id="btnSalvarMetaAnual">Salvar</button>
          </div>
          <div class="meta-projecao">📅 ${diasRestantes} dias restantes no mês</div>
        </div>
      </div>
    `;
  }

  circuloProgresso(pct, label, subtitulo) {
    const r = 56, circ = 2 * Math.PI * r;
    const offset = circ - (pct / 100) * circ;
    return `
      <div class="circulo-progresso">
        <svg viewBox="0 0 140 140">
          <circle class="bg-circle" cx="70" cy="70" r="${r}"/>
          <circle class="progress-circle" cx="70" cy="70" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
        </svg>
        <div class="centro-texto">
          <div class="pct">${label}</div>
          <div class="pct-label">${subtitulo}</div>
        </div>
      </div>
    `;
  }

  // --- EVENT BINDING ---
  aposRenderizar() {
    this.removerListeners();

    // Calculadora - atualização em tempo real
    ['calcMateriais','calcHoras','calcValorHora','calcLargura','calcAltura'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      const handler = () => {
        this.calc[id.replace('calc', '').toLowerCase()] = Number(el.value) || 0;
        if (id === 'calcValorHora') this.salvarConfig({ valorHora: Number(el.value) || 60 });
        this.atualizarResultado();
      };
      el.addEventListener('input', handler);
      this._bindCache[id] = { el, handler, type: 'input' };
    });

    // Estrelas
    const estrelasContainer = document.getElementById('estrelasInput');
    if (estrelasContainer) {
      const handler = (e) => {
        const est = e.target.closest('.estrela');
        if (!est) return;
        this.calc.complexidade = Number(est.dataset.val);
        estrelasContainer.querySelectorAll('.estrela').forEach(el => el.classList.toggle('preenchida', Number(el.dataset.val) <= this.calc.complexidade));
        this.atualizarResultado();
      };
      estrelasContainer.addEventListener('click', handler);
      this._bindCache['estrelasInput'] = { el: estrelasContainer, handler, type: 'click' };
    }

    // Select obra
    const selObra = document.getElementById('selObraCalc');
    if (selObra) {
      const handler = () => {
        const obra = this.dataStore.buscarPorId('obras', selObra.value);
        if (obra) {
          document.getElementById('calcMateriais').value = obra.custoMateriais || 0;
          document.getElementById('calcHoras').value = obra.horasTrabalho || 0;
          if (obra.dimensoes) {
            document.getElementById('calcLargura').value = obra.dimensoes.largura || 0;
            document.getElementById('calcAltura').value = obra.dimensoes.altura || 0;
          }
          this.calc.materiais = Number(obra.custoMateriais) || 0;
          this.calc.horas = Number(obra.horasTrabalho) || 0;
          this.calc.largura = (obra.dimensoes && obra.dimensoes.largura) || 0;
          this.calc.altura = (obra.dimensoes && obra.dimensoes.altura) || 0;
          this.calc.obraId = obra.id;
          this.atualizarResultado();
        } else {
          this.calc.obraId = '';
        }
      };
      selObra.addEventListener('change', handler);
      this._bindCache['selObraCalc'] = { el: selObra, handler, type: 'change' };
    }

    // Salvar preço na obra
    document.getElementById('btnSalvarPrecoCalc')?.addEventListener('click', () => this.salvarPrecoNaObra());

    // Histórico selector
    document.getElementById('selHistoricoObra')?.addEventListener('change', () => this.rerenderizar());

    // Metas
    document.getElementById('btnSalvarMetaMensal')?.addEventListener('click', () => {
      const v = Number(document.getElementById('metaMensalInput')?.value) || 0;
      this.salvarConfig({ metaMensal: v });
      mostrarToast('Meta mensal salva!');
      this.rerenderizar();
    });
    document.getElementById('btnSalvarMetaAnual')?.addEventListener('click', () => {
      const v = Number(document.getElementById('metaAnualInput')?.value) || 0;
      this.salvarConfig({ metaAnual: v });
      mostrarToast('Meta anual salva!');
      this.rerenderizar();
    });

    // Exportar relatório PDF
    document.getElementById('btnExportarRelatorio')?.addEventListener('click', () => this.exportarRelatorioPDF());
  }

  atualizarResultado() {
    const preco = this.calcularPreco(this.calc);
    const elValor = document.getElementById('valorSugerido');
    const elDetalhe = document.getElementById('detalheCalculo');
    const elFaixa = document.getElementById('faixaComparativa');
    if (elValor) elValor.textContent = formatarMoeda(preco);
    if (elDetalhe) elDetalhe.textContent = this.detalharCalculo(preco);
    if (elFaixa) {
      const obras = this.dataStore.listar('obras') || [];
      elFaixa.innerHTML = this.renderFaixaComparativa(obras);
    }
  }

  salvarPrecoNaObra() {
    const obraId = this.calc.obraId || document.getElementById('selObraCalc')?.value;
    if (!obraId) { mostrarToast('Selecione uma obra primeiro.'); return; }
    const precoSugerido = this.calcularPreco(this.calc);
    const obra = this.dataStore.buscarPorId('obras', obraId);
    if (!obra) { mostrarToast('Obra não encontrada.'); return; }

    const hist = obra.historicoPrecos || [];
    if (obra.preco && Number(obra.preco) > 0) {
      hist.push({ preco: Number(obra.preco), data: new Date().toISOString().slice(0, 10), motivo: 'Reajuste via Precificador' });
    }
    hist.push({ preco: precoSugerido, data: new Date().toISOString().slice(0, 10), motivo: 'Preço sugerido pelo Precificador' });

    this.dataStore.atualizar('obras', obraId, {
      preco: precoSugerido,
      custoMateriais: Number(this.calc.materiais) || 0,
      horasTrabalho: Number(this.calc.horas) || 0,
      historicoPrecos: hist
    });
    mostrarToast(`Preço ${formatarMoeda(precoSugerido)} salvo na obra "${obra.titulo || ''}"!`);
    this.rerenderizar();
  }

  // --- PDF Export ---
  exportarRelatorioPDF() {
    if (typeof window.jspdf === 'undefined' && typeof jspdf === 'undefined') {
      mostrarToast('jsPDF não carregado. Tente novamente.');
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const obras = this.dataStore.listar('obras') || [];
    const vendas = this.dataStore.listar('vendas') || [];
    const cfg = this.config;
    const artista = this.dataStore.dados.config.artista?.nome || 'Artista';

    let y = 20;
    const margem = 20;
    const larg = 170;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.text('Relatório de Precificação', margem, y);
    y += 8;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.text(`Artista: ${artista} | Gerado em: ${new Date().toLocaleDateString('pt-BR')}`, margem, y);
    y += 6;
    doc.setDrawColor(200);
    doc.line(margem, y, margem + larg, y);
    y += 8;

    // Preços sugeridos
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text('Preços Sugeridos', margem, y);
    y += 6;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);

    const precificaveis = obras.filter(o => o.dimensoes && o.dimensoes.largura && o.dimensoes.altura);
    if (precificaveis.length > 0) {
      precificaveis.slice(0, 15).forEach(o => {
        const area = o.dimensoes.largura * o.dimensoes.altura;
        const calcTemp = { materiais: Number(o.custoMateriais) || 0, horas: Number(o.horasTrabalho) || 0, valorHora: cfg.valorHora || 60, largura: o.dimensoes.largura, altura: o.dimensoes.altura, complexidade: 3 };
        const sugerido = this.calcularPreco(calcTemp);
        if (y > 270) { doc.addPage(); y = 20; }
        doc.text(`${o.titulo || 'Sem título'} — Atual: R$ ${Number(o.preco || 0).toFixed(2)} | Sugerido: R$ ${sugerido.toFixed(2)} | ${o.tecnica || ''} | ${o.dimensoes.largura}×${o.dimensoes.altura}cm`, margem, y);
        y += 5;
      });
    } else {
      doc.text('Nenhuma obra com dimensões para calcular preço sugerido.', margem, y);
      y += 5;
    }

    y += 6;
    doc.setDrawColor(200);
    doc.line(margem, y, margem + larg, y);
    y += 8;

    // Metas
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text('Metas Financeiras', margem, y);
    y += 6;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    const agora = new Date();
    const mesAtual = agora.getMonth(), anoAtual = agora.getFullYear();
    const fatMes = vendas.filter(v => v.dataVenda && v.valorTotal && new Date(v.dataVenda).getMonth() === mesAtual && new Date(v.dataVenda).getFullYear() === anoAtual).reduce((s, v) => s + Number(v.valorTotal), 0);
    const fatAno = vendas.filter(v => v.dataVenda && v.valorTotal && new Date(v.dataVenda).getFullYear() === anoAtual).reduce((s, v) => s + Number(v.valorTotal), 0);
    doc.text(`Meta Mensal: R$ ${(cfg.metaMensal || 10000).toFixed(2)} | Faturamento: R$ ${fatMes.toFixed(2)}`, margem, y); y += 5;
    doc.text(`Meta Anual: R$ ${(cfg.metaAnual || 120000).toFixed(2)} | Faturamento: R$ ${fatAno.toFixed(2)}`, margem, y); y += 5;
    const pctMes = cfg.metaMensal > 0 ? Math.round((fatMes / cfg.metaMensal) * 100) : 0;
    doc.text(`Progresso mensal: ${pctMes}%`, margem, y); y += 5;

    y += 6;
    doc.setDrawColor(200);
    doc.line(margem, y, margem + larg, y);
    y += 8;

    // Análise
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text('Análise do Portfólio', margem, y);
    y += 6;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    const precos = obras.filter(o => Number(o.preco) > 0).map(o => Number(o.preco));
    const media = precos.length ? Math.round(precos.reduce((s, v) => s + v, 0) / precos.length) : 0;
    const total = precos.reduce((s, v) => s + v, 0);
    doc.text(`Obras precificadas: ${precos.length}`, margem, y); y += 5;
    doc.text(`Preço médio: R$ ${media.toFixed(2)}`, margem, y); y += 5;
    doc.text(`Valor total do portfólio: R$ ${total.toFixed(2)}`, margem, y); y += 5;
    if (precos.length > 0) {
      doc.text(`Menor preço: R$ ${Math.min(...precos).toFixed(2)} | Maior preço: R$ ${Math.max(...precos).toFixed(2)}`, margem, y); y += 5;
    }

    doc.save('relatorio-precificacao.pdf');
    mostrarToast('Relatório PDF exportado com sucesso!');
  }

  // --- Utilitários ---
  rerenderizar() {
    const container = document.getElementById('viewPrincipal');
    if (container) {
      this.removerListeners();
      container.innerHTML = this.render();
      this.aposRenderizar();
    }
  }

  removerListeners() {
    Object.values(this._bindCache).forEach(({ el, handler, type }) => {
      try { el.removeEventListener(type, handler); } catch (e) {}
    });
    this._bindCache = {};
  }

  destruir() { this.removerListeners(); }
}

/* ==========================================================================
    MÓDULO NOVO: ATELIER — ESTOQUE E MATERIAIS (/atelier)
   ========================================================================== */
class AtelierView {
  constructor(dataStore, router) {
    this.dataStore = dataStore;
    this.router = router;
    this.tabAtiva = 'estoque';
    this.filtroCategoria = '';
    this._bindCache = {};
    this.catIcones = { tintas: '🎨', superficies: '📐', ferramentas: '🔧', molduras: '🖼️' };
    this.catLabels = { tintas: 'Tintas', superficies: 'Superfícies', ferramentas: 'Ferramentas', molduras: 'Molduras' };
  }

  get materiais() { return this.dataStore.listar('materiais') || []; }
  get fornecedores() { return this.dataStore.listar('fornecedores') || []; }
  get consumos() { return this.dataStore.listar('consumos') || []; }
  get obras() { return this.dataStore.listar('obras') || []; }

  // --- RENDER ---
  render() {
    const tabs = ['estoque', 'consumo', 'compras', 'fornecedores', 'custo'];
    const tabLabels = { estoque: '📦 Estoque', consumo: '📋 Consumo', compras: '🛒 Compras', fornecedores: '🏪 Fornecedores', custo: '💰 Custo p/ Obra' };
    const tabContent = {
      estoque: () => this.renderEstoque(),
      consumo: () => this.renderConsumo(),
      compras: () => this.renderCompras(),
      fornecedores: () => this.renderFornecedores(),
      custo: () => this.renderCustoObra()
    };

    return `
      <div>
        <div class="atelier-tabs">
          ${tabs.map(t => `<button class="tab-btn ${t === this.tabAtiva ? 'ativo' : ''}" data-tab="${t}">${tabLabels[t]}</button>`).join('')}
        </div>
        <div id="atelierContent">${tabContent[this.tabAtiva]()}</div>
      </div>
    `;
  }

  // --- ESTOQUE ---
  renderEstoque() {
    const materiais = this.materiais;
    const cats = Object.keys(this.catLabels);
    const filtrados = this.filtroCategoria ? materiais.filter(m => m.categoria === this.filtroCategoria) : materiais;

    return `
      <div class="mat-filtros">
        <select id="filtroCatEstoque">
          <option value="">📂 Todas as categorias</option>
          ${cats.map(c => `<option value="${c}" ${this.filtroCategoria === c ? 'selected' : ''}>${this.catIcones[c]} ${this.catLabels[c]}</option>`).join('')}
        </select>
        <button class="btn-primario" id="btnNovoMaterial" style="font-size:0.8rem;padding:6px 14px;">✚ Novo Material</button>
        <span style="font-size:0.8rem;color:var(--text-muted);margin-left:auto;">${filtrados.length} item(ns)</span>
      </div>
      <div class="mat-grid">
        ${filtrados.length === 0 ? '<p style="color:var(--text-muted);font-size:0.85rem;">Nenhum material encontrado.</p>' : ''}
        ${filtrados.map(m => this.renderCardMaterial(m)).join('')}
      </div>
    `;
  }

  renderCardMaterial(m) {
    const qtd = Number(m.quantidade) || 0;
    const min = Number(m.quantidadeMinima) || 0;
    const nivel = qtd <= 0 ? 'baixo' : (min > 0 && qtd <= min ? 'baixo' : (min > 0 && qtd <= min * 2 ? 'medio' : 'ok'));
    const badgeLabel = nivel === 'baixo' ? '⚠️ Repor' : (nivel === 'medio' ? '⚠️ Atenção' : '✅ OK');
    const categoria = m.categoria || 'outros';

    return `
      <div class="mat-card">
        <div class="mat-faixa-alerta ${nivel}"></div>
        <div class="mat-header">
          <div>
            <div class="mat-nome">${this.catIcones[categoria]} ${m.nome || ''}</div>
            <span class="mat-cat ${categoria}">${this.catLabels[categoria] || categoria} ${m.subcategoria ? '· '+m.subcategoria : ''}</span>
          </div>
          <div style="text-align:right;">
            <div class="mat-qtd ${nivel === 'baixo' ? 'alerta' : 'ok'}">${qtd}</div>
            <div class="mat-qtd-label">${m.unidade || 'un'}</div>
            <span class="mat-badge ${nivel}">${badgeLabel}</span>
          </div>
        </div>
        <div class="mat-detalhes">
          ${m.marca ? `<span>🏷️ ${m.marca}</span>` : ''}
          ${m.local ? `<span>📍 ${m.local}</span>` : ''}
          ${m.precoUnitario ? `<span>💰 R$ ${Number(m.precoUnitario).toFixed(2)}/${m.unidade || 'un'}</span>` : ''}
          ${m.dataAquisicao ? `<span>📅 ${m.dataAquisicao}</span>` : ''}
          ${m.validade ? `<span>⏳ Val: ${m.validade}</span>` : ''}
        </div>
        ${m.notas ? `<div style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;">📝 ${m.notas}</div>` : ''}
        <div class="mat-acoes">
          <button data-acao="editarMaterial" data-id="${m.id}">✏️ Editar</button>
          <button data-acao="consumirMaterial" data-id="${m.id}">📉 Consumir</button>
          <button data-acao="excluirMaterial" data-id="${m.id}" style="color:#dc2626;">🗑️</button>
        </div>
      </div>
    `;
  }

  // --- CONSUMO ---
  renderConsumo() {
    const consumos = this.consumos;
    const materiais = this.materiais;
    const obras = this.obras;

    const rows = consumos.map(c => {
      const mat = materiais.find(m => m.id === c.materialId);
      const obra = obras.find(o => o.id === c.obraId);
      const custo = mat && mat.precoUnitario ? (Number(c.quantidade) * Number(mat.precoUnitario)) : null;
      return { ...c, matNome: mat ? mat.nome : '(removido)', obraTitulo: obra ? obra.titulo : '(removida)', custo };
    }).reverse();

    return `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
        <button class="btn-primario" id="btnNovoConsumo" style="font-size:0.8rem;padding:6px 14px;">✚ Registrar Consumo</button>
        <span style="font-size:0.8rem;color:var(--text-muted);">${consumos.length} registro(s)</span>
      </div>
      ${rows.length === 0 ? '<p style="color:var(--text-muted);font-size:0.85rem;">Nenhum consumo registrado.</p>' : `
      <table class="cons-table">
        <tr><th>Material</th><th>Obra</th><th>Qtd</th><th>Custo</th><th>Data</th><th>Notas</th><th></th></tr>
        ${rows.map(r => `
          <tr>
            <td class="cons-obra">${r.matNome}</td>
            <td>${r.obraTitulo}</td>
            <td>${r.quantidade}</td>
            <td>${r.custo !== null ? formatarMoeda(r.custo) : '—'}</td>
            <td>${r.data || '—'}</td>
            <td style="font-size:0.75rem;color:var(--text-muted);max-width:150px;overflow:hidden;text-overflow:ellipsis;">${r.notas || ''}</td>
            <td><button data-acao="excluirConsumo" data-id="${r.id}" style="font-size:0.7rem;padding:2px 6px;border:1px solid var(--border);background:var(--bg);color:#dc2626;cursor:pointer;">🗑️</button></td>
          </tr>
        `).join('')}
      </table>`}
    `;
  }

  // --- COMPRAS ---
  renderCompras() {
    const materiais = this.materiais;
    const abaixoMin = materiais.filter(m => { const q = Number(m.quantidade) || 0; const min = Number(m.quantidadeMinima) || 0; return min > 0 && q <= min; });
    const todosItens = materiais.filter(m => m.comprado !== undefined);
    const paraComprar = materiais.filter(m => m.comprado === false);
    const comprados = materiais.filter(m => m.comprado === true);
    const totalEst = paraComprar.reduce((s, m) => s + (Number(m.precoUnitario) || 0) * Math.max(1, Math.ceil(((Number(m.quantidadeMinima) || 0) * 2 - (Number(m.quantidade) || 0)) / 1)), 0);

    return `
      <div class="compras-resumo">
        <div class="cr-item"><div class="cr-valor">${abaixoMin.length}</div><div class="cr-label">⚠️ Abaixo do mínimo</div></div>
        <div class="cr-item"><div class="cr-valor">${paraComprar.length}</div><div class="cr-label">🛒 Para comprar</div></div>
        <div class="cr-item"><div class="cr-valor">${comprados.length}</div><div class="cr-label">✅ Comprados</div></div>
        <div class="cr-item"><div class="cr-valor">${formatarMoeda(Math.round(totalEst))}</div><div class="cr-label">💰 Custo estimado</div></div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
        <button class="btn-primario" id="btnGerarLista" style="font-size:0.8rem;padding:6px 14px;">⚡ Gerar lista automática</button>
        <button class="btn-secundario" id="btnAddItemLista" style="font-size:0.8rem;padding:6px 14px;">✚ Adicionar item manual</button>
        <button class="btn-secundario" id="btnExportarListaTXT" style="font-size:0.8rem;padding:6px 14px;">📄 Exportar TXT</button>
      </div>
      ${paraComprar.length === 0 && comprados.length === 0 ? '<p style="color:var(--text-muted);font-size:0.85rem;">Nenhum item na lista. Clique em "Gerar lista automática".</p>' : ''}
      <ul class="lista-compras">
        ${paraComprar.map(m => this.renderItemCompra(m, false)).join('')}
        ${comprados.map(m => this.renderItemCompra(m, true)).join('')}
      </ul>
    `;
  }

  renderItemCompra(m, comprado) {
    const qtdSugerida = Math.max(1, Math.ceil(((Number(m.quantidadeMinima) || 0) * 2 - (Number(m.quantidade) || 0))));
    return `
      <li class="${comprado ? 'comprado' : ''}">
        <div class="lc-info">
          <div class="lc-nome">${this.catIcones[m.categoria] || '📦'} ${m.nome}</div>
          <div class="lc-cat">${this.catLabels[m.categoria] || m.categoria} ${m.marca ? '· '+m.marca : ''}</div>
        </div>
        <div class="lc-qtd">${comprado ? '✔️' : `Qtd: ${qtdSugerida} ${m.unidade || 'un'}`}</div>
        ${m.precoUnitario ? `<div class="lc-preco">${formatarMoeda(Math.round((Number(m.precoUnitario) || 0) * qtdSugerida))}</div>` : ''}
        <div class="lc-acoes">
          ${comprado ? `<button data-acao="desmarcarComprado" data-id="${m.id}">↩️</button>` : `<button data-acao="marcarComprado" data-id="${m.id}">✅</button>`}
          <button data-acao="removerLista" data-id="${m.id}" style="color:#dc2626;">🗑️</button>
        </div>
      </li>
    `;
  }

  // --- FORNECEDORES ---
  renderFornecedores() {
    const fornecedores = this.fornecedores;
    return `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <button class="btn-primario" id="btnNovoFornecedor" style="font-size:0.8rem;padding:6px 14px;">✚ Novo Fornecedor</button>
        <span style="font-size:0.8rem;color:var(--text-muted);">${fornecedores.length} fornecedor(es)</span>
      </div>
      <div class="forn-grid">
        ${fornecedores.length === 0 ? '<p style="color:var(--text-muted);font-size:0.85rem;">Nenhum fornecedor cadastrado.</p>' : ''}
        ${fornecedores.map(f => {
          const hist = f.historicoCompras || [];
          const totalGasto = hist.reduce((s, h) => s + Number(h.valor || 0), 0);
          return `
            <div class="forn-card">
              <div class="forn-nome">🏪 ${f.nome}</div>
              <div class="forn-contato">${f.contato || ''}${f.email ? ' · '+f.email : ''}</div>
              <div class="forn-esp">📌 ${f.especialidade || 'Sem especialidade'}</div>
              ${f.avaliacao ? `<div class="forn-estrelas">${'★'.repeat(Math.min(5, Number(f.avaliacao)))}${'☆'.repeat(Math.max(0, 5 - Number(f.avaliacao)))}</div>` : ''}
              ${f.notas ? `<div style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;">📝 ${f.notas}</div>` : ''}
              ${hist.length > 0 ? `
                <div class="forn-hist">
                  <div style="font-size:0.75rem;font-weight:600;color:var(--text-muted);margin-bottom:4px;">Histórico (Total: ${formatarMoeda(totalGasto)})</div>
                  ${hist.map(h => `<div class="hist-item"><span>${h.data || ''} — ${h.itens || ''}</span><span>${formatarMoeda(Number(h.valor) || 0)}</span></div>`).join('')}
                </div>
              ` : ''}
              <div class="forn-acoes">
                <button data-acao="editarFornecedor" data-id="${f.id}">✏️ Editar</button>
                <button data-acao="excluirFornecedor" data-id="${f.id}" style="color:#dc2626;">🗑️</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  // --- CUSTO POR OBRA ---
  renderCustoObra() {
    const obras = this.obras;
    const consumos = this.consumos;
    const materiais = this.materiais;

    return `
      <div style="margin-bottom:12px;">
        <select id="selCustoObra" style="padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:0.9rem;background:var(--bg);color:var(--text);width:100%;max-width:400px;">
          <option value="">— Selecione uma obra —</option>
          ${obras.map(o => `<option value="${o.id}">${o.titulo || 'Sem título'} ${o.preco ? '— '+formatarMoeda(o.preco) : ''}</option>`).join('')}
        </select>
      </div>
      <div id="custoObraDetalhe">
        <p style="color:var(--text-muted);font-size:0.85rem;">Selecione uma obra para ver o detalhamento de custos.</p>
      </div>
    `;
  }

  renderCustoDetalhe(obraId) {
    const obra = this.dataStore.buscarPorId('obras', obraId);
    if (!obra) return '<p style="color:var(--text-muted);">Obra não encontrada.</p>';
    const consumosObra = this.consumos.filter(c => c.obraId === obraId);
    const materiais = this.materiais;

    let custoTotal = 0;
    const rows = consumosObra.map(c => {
      const mat = materiais.find(m => m.id === c.materialId);
      const custo = mat && mat.precoUnitario ? Number(c.quantidade) * Number(mat.precoUnitario) : 0;
      custoTotal += custo;
      return { ...c, matNome: mat ? mat.nome : '(removido)', custo };
    });

    const precoVenda = Number(obra.preco) || 0;
    const margem = precoVenda > 0 ? ((precoVenda - custoTotal) / precoVenda * 100) : 0;
    const margemClass = margem >= 60 ? 'lucro-alta' : (margem >= 30 ? 'lucro-media' : 'lucro-baixa');

    return `
      <div class="custo-obra-header">
        <div class="custo-obra-card">
          <div class="co-valor">${formatarMoeda(Math.round(custoTotal))}</div>
          <div class="co-label">💰 Custo de produção</div>
        </div>
        <div class="custo-obra-card">
          <div class="co-valor">${precoVenda > 0 ? formatarMoeda(precoVenda) : '—'}</div>
          <div class="co-label">🏷️ Preço de venda</div>
        </div>
        <div class="custo-obra-card">
          <div class="co-valor ${margemClass}">${margem > 0 ? margem.toFixed(1) + '%' : '—'}</div>
          ${margem > 0 ? `<div class="co-label">📈 Margem de lucro ${margem >= 60 ? '✅' : (margem >= 30 ? '⚠️' : '🔻')}</div>` : '<div class="co-label">Sem venda definida</div>'}
        </div>
      </div>
      ${rows.length === 0 ? '<p style="color:var(--text-muted);font-size:0.85rem;">Nenhum material registrado como consumido nesta obra.</p>' : `
      <table class="cons-table">
        <tr><th>Material</th><th>Qtd</th><th>Valor unit.</th><th>Custo</th><th>Data</th><th>Notas</th></tr>
        ${rows.map(r => `<tr><td class="cons-obra">${r.matNome}</td><td>${r.quantidade}</td><td>${materiais.find(m => m.id === r.materialId)?.precoUnitario ? 'R$ '+Number(materiais.find(m => m.id === r.materialId).precoUnitario).toFixed(2) : '—'}</td><td>${formatarMoeda(Math.round(r.custo))}</td><td>${r.data || '—'}</td><td style="font-size:0.75rem;color:var(--text-muted);">${r.notas || ''}</td></tr>`).join('')}
        <tr style="font-weight:600;"><td>TOTAL</td><td></td><td></td><td>${formatarMoeda(Math.round(custoTotal))}</td><td></td><td></td></tr>
      </table>`}
      <div style="margin-top:12px;font-size:0.85rem;color:var(--text-muted);">
        💡 Dica: Registre materiais usados na aba <strong>Consumo</strong> para ver o custo real de cada obra.
      </div>
    `;
  }

  // --- EVENT BINDING ---
  aposRenderizar() {
    this.removerListeners();

    // Tabs
    document.querySelectorAll('.tab-btn[data-tab]').forEach(btn => {
      const handler = () => {
        this.tabAtiva = btn.dataset.tab;
        this.rerenderizar();
      };
      btn.addEventListener('click', handler);
      this._bindCache['tab_' + btn.dataset.tab] = { el: btn, handler, type: 'click' };
    });

    // Filtro estoque
    const filtro = document.getElementById('filtroCatEstoque');
    if (filtro) {
      const handler = () => { this.filtroCategoria = filtro.value; this.rerenderizar(); };
      filtro.addEventListener('change', handler);
      this._bindCache['filtroCatEstoque'] = { el: filtro, handler, type: 'change' };
    }

    // Novo material
    document.getElementById('btnNovoMaterial')?.addEventListener('click', () => this.abrirFormMaterial());
    document.getElementById('btnNovoConsumo')?.addEventListener('click', () => this.abrirFormConsumo());
    document.getElementById('btnNovoFornecedor')?.addEventListener('click', () => this.abrirFormFornecedor());

    // Compras buttons
    document.getElementById('btnGerarLista')?.addEventListener('click', () => this.gerarListaCompras());
    document.getElementById('btnAddItemLista')?.addEventListener('click', () => this.abrirFormMaterial(true));
    document.getElementById('btnExportarListaTXT')?.addEventListener('click', () => this.exportarListaTXT());

    // Select custo obra
    const selCusto = document.getElementById('selCustoObra');
    if (selCusto) {
      const handler = () => {
        const detalhe = document.getElementById('custoObraDetalhe');
        if (detalhe) detalhe.innerHTML = selCusto.value ? this.renderCustoDetalhe(selCusto.value) : '<p style="color:var(--text-muted);font-size:0.85rem;">Selecione uma obra para ver o detalhamento de custos.</p>';
      };
      selCusto.addEventListener('change', handler);
      this._bindCache['selCustoObra'] = { el: selCusto, handler, type: 'change' };
    }

    // Delegated actions
    const container = document.getElementById('atelierContent') || document.getElementById('viewPrincipal');
    if (container) {
      const handler = (e) => {
        const btn = e.target.closest('[data-acao]');
        if (!btn) return;
        const acao = btn.dataset.acao;
        const id = btn.dataset.id;
        if (acao === 'editarMaterial') this.abrirFormMaterial(false, id);
        else if (acao === 'excluirMaterial') this.excluirMaterial(id);
        else if (acao === 'consumirMaterial') this.consumirRapido(id);
        else if (acao === 'excluirConsumo') this.excluirConsumo(id);
        else if (acao === 'editarFornecedor') this.abrirFormFornecedor(id);
        else if (acao === 'excluirFornecedor') this.excluirFornecedor(id);
        else if (acao === 'marcarComprado') this.marcarComprado(id, true);
        else if (acao === 'desmarcarComprado') this.marcarComprado(id, false);
        else if (acao === 'removerLista') this.removerDaLista(id);
      };
      container.addEventListener('click', handler);
      this._bindCache['delegatedAtelier'] = { el: container, handler, type: 'click' };
    }
  }

  // --- CRUD Material ---
  abrirFormMaterial(ehLista = false, id = null) {
    const mat = id ? this.dataStore.buscarPorId('materiais', id) : null;
    const isLista = ehLista || (mat && mat.comprado !== undefined);

    const cats = Object.keys(this.catLabels);
    const catOpts = cats.map(c => `<option value="${c}" ${mat && mat.categoria === c ? 'selected' : ''}>${this.catIcones[c]} ${this.catLabels[c]}</option>`).join('');

    abrirModal(`
      <h3>${mat ? '✏️ Editar' : isLista ? '✚ Adicionar à Lista' : '✚ Novo Material'}</h3>
      <form id="formModal" style="display:grid;gap:10px;">
        <div class="modal-form-grid">
          <div class="campo-full"><label style="font-size:0.8rem;color:var(--text-muted);">Nome *</label><input type="text" id="fMatNome" value="${mat ? mat.nome || '' : ''}" required style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;background:var(--bg);color:var(--text);box-sizing:border-box;"></div>

          <div><label style="font-size:0.8rem;color:var(--text-muted);">Subcategoria</label><input type="text" id="fMatSub" value="${mat ? mat.subcategoria || '' : ''}" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;background:var(--bg);color:var(--text);box-sizing:border-box;"></div>
          <div><label style="font-size:0.8rem;color:var(--text-muted);">Marca</label><input type="text" id="fMatMarca" value="${mat ? mat.marca || '' : ''}" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;background:var(--bg);color:var(--text);box-sizing:border-box;"></div>
          <div><label style="font-size:0.8rem;color:var(--text-muted);">Quantidade atual</label><input type="number" id="fMatQtd" value="${mat ? mat.quantidade || 0 : 0}" min="0" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;background:var(--bg);color:var(--text);box-sizing:border-box;"></div>
